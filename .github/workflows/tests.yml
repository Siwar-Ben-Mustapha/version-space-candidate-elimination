name: Tests

on: [push, pull_request]

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  navigateur:
    runs-on: ubuntu-latest
    needs: moteur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56 && npx playwright install --with-deps chromium
      - run: |
          python serveur.py &
          sleep 2
          node tests/parcours_navigateur.cjs
